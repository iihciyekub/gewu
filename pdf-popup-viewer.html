<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="pdfFrame"></iframe>
    <script>
        // 从URL参数获取PDF文件路径和主题
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const theme = params.get('theme') || 'light';
        
        if (file) {
            const viewerUrl = `js/pdfjs/web/viewer.html?file=${encodeURIComponent(file)}&theme=${theme}#zoom=80`;
            document.getElementById('pdfFrame').src = viewerUrl;
        } else {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#666;">No PDF specified</div>';
        }
        
        // 添加键盘事件监听
        document.addEventListener('keydown', (e) => {
            // ESC键：关闭独立窗口，回到内嵌模式
            if (e.key === 'Escape') {
                e.preventDefault();
                window.close();
                return;
            }
            
            // 屏蔽 Cmd/Ctrl+S 保存动作
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        
        // 在iframe内部也监听键盘事件
        window.addEventListener('load', () => {
            const iframe = document.getElementById('pdfFrame');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.document.addEventListener('keydown', (e) => {
                        // ESC键：关闭独立窗口
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            window.close();
                            return;
                        }
                        
                        // 屏蔽 Cmd/Ctrl+S
                        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                            e.preventDefault();
                            e.stopPropagation();
                            return false;
                        }
                    }, true);
                } catch (err) {
                    // 跨域限制时忽略
                    console.log('Cannot access iframe content due to CORS');
                }
            }
        });
    </script>
</body>
</html>
