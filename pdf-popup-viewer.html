<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="pdfFrame"></iframe>
    <script>
        // 从URL参数获取PDF文件路径和主题
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const theme = params.get('theme') || 'light';
        
        if (file) {
            const viewerUrl = `js/pdfjs/web/viewer.html?file=${encodeURIComponent(file)}&theme=${theme}#zoom=80`;
            document.getElementById('pdfFrame').src = viewerUrl;
        } else {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#666;">No PDF specified</div>';
        }
    </script>
</body>
</html>
