<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="pdfFrame"></iframe>
    <script>
        // 从URL参数获取PDF文件路径和主题
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const theme = params.get('theme') || 'light';
        
        if (file) {
            const viewerUrl = `js/pdfjs/web/viewer.html?file=${encodeURIComponent(file)}&theme=${theme}#zoom=80`;
            document.getElementById('pdfFrame').src = viewerUrl;
        } else {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#666;">No PDF specified</div>';
        }
        
        // 🔑 监听父窗口状态，如果父窗口刷新或关闭，则自动关闭此独立窗口
        function monitorParentWindow() {
            // 生成窗口会话ID，用于跟踪父窗口状态
            const sessionId = Date.now() + '_' + Math.random();
            
            // 在localStorage中标记此窗口存在
            try {
                localStorage.setItem('pdfPopupWindowActive', sessionId);
                console.log('✅ PDF窗口已标记为活动状态:', sessionId);
            } catch (e) {
                console.warn('无法设置localStorage标记');
            }
            
            // 检查父窗口（opener）是否存在
            if (!window.opener) {
                console.log('⚠️ 没有父窗口引用，独立PDF窗口将关闭');
                window.close();
                return;
            }
            
            // 定期检查父窗口是否还在
            const checkInterval = setInterval(() => {
                try {
                    // 检查localStorage中的关闭信号
                    const shouldClose = localStorage.getItem('closePdfPopupWindow');
                    if (shouldClose === 'true') {
                        console.log('🔄 收到关闭信号，独立PDF窗口将关闭');
                        localStorage.removeItem('closePdfPopupWindow');
                        localStorage.removeItem('pdfPopupWindowActive');
                        clearInterval(checkInterval);
                        window.close();
                        return;
                    }
                    
                    // 尝试访问父窗口，如果父窗口已关闭或刷新，会抛出错误
                    if (!window.opener || window.opener.closed) {
                        console.log('🔄 父窗口已关闭或刷新，独立PDF窗口将关闭');
                        localStorage.removeItem('pdfPopupWindowActive');
                        clearInterval(checkInterval);
                        window.close();
                        return;
                    }
                    
                    // 检查父窗口是否还有我们的应用实例
                    if (!window.opener.paperReviewerApp) {
                        console.log('🔄 父窗口已重新加载，独立PDF窗口将关闭');
                        localStorage.removeItem('pdfPopupWindowActive');
                        clearInterval(checkInterval);
                        window.close();
                        return;
                    }
                } catch (err) {
                    // 如果访问父窗口出错（跨域或已关闭），关闭此窗口
                    console.log('🔄 无法访问父窗口，独立PDF窗口将关闭');
                    localStorage.removeItem('pdfPopupWindowActive');
                    clearInterval(checkInterval);
                    window.close();
                }
            }, 500); // 每500ms检查一次
            
            // 监听父窗口的 beforeunload 事件
            try {
                if (window.opener && window.opener.addEventListener) {
                    window.opener.addEventListener('beforeunload', () => {
                        console.log('🔄 父窗口即将卸载，独立PDF窗口将关闭');
                        localStorage.removeItem('pdfPopupWindowActive');
                        clearInterval(checkInterval);
                        window.close();
                    });
                }
            } catch (err) {
                // 跨域限制时忽略
                console.log('无法监听父窗口 beforeunload 事件:', err);
            }
            
            // 窗口关闭时清理标记
            window.addEventListener('beforeunload', () => {
                try {
                    localStorage.removeItem('pdfPopupWindowActive');
                } catch (e) {
                    // 忽略错误
                }
            });
        }
        
        // 立即开始监控父窗口
        monitorParentWindow();
        
        // 添加键盘事件监听
        document.addEventListener('keydown', (e) => {
            // ESC键：关闭独立窗口，回到内嵌模式
            if (e.key === 'Escape') {
                e.preventDefault();
                window.close();
                return;
            }
            
            // 屏蔽 Cmd/Ctrl+S 保存动作
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        
        // 在iframe内部也监听键盘事件和下载事件
        window.addEventListener('load', () => {
            const iframe = document.getElementById('pdfFrame');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.document.addEventListener('keydown', (e) => {
                        // ESC键：关闭独立窗口
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            window.close();
                            return;
                        }
                        
                        // 屏蔽 Cmd/Ctrl+S
                        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                            e.preventDefault();
                            e.stopPropagation();
                            return false;
                        }
                    }, true);
                } catch (err) {
                    // 跨域限制时忽略
                    console.log('Cannot access iframe content due to CORS');
                }
                
                // 监听PDF.js的下载事件并拦截，使用带标注的保存逻辑
                setupPdfDownloadInterceptor();
            }
        });
        
        // 设置PDF下载拦截器，调用主窗口的保存方法
        function setupPdfDownloadInterceptor() {
            const iframe = document.getElementById('pdfFrame');
            if (!iframe || !iframe.contentWindow) return;
            
            // 保存状态锁
            let isSaving = false;
            
            try {
                const iframeWindow = iframe.contentWindow;
                
                // 等待PDFViewerApplication加载完成
                const waitForPdfApp = setInterval(() => {
                    const pdfApp = iframeWindow.PDFViewerApplication;
                    if (!pdfApp || !pdfApp.eventBus) return;
                    
                    clearInterval(waitForPdfApp);
                    
                    console.log('✅ PDF.js已加载，设置下载拦截器');
                    
                    // 监听download事件
                    pdfApp.eventBus.on('download', async (evt) => {
                        console.log('📥 拦截PDF下载事件，调用主窗口保存方法');
                        
                        // 防止重复保存
                        if (isSaving) {
                            console.log('⏳ 正在保存中，忽略重复请求');
                            return;
                        }
                        
                        // 阻止默认下载行为
                        if (evt && evt.preventDefault) {
                            evt.preventDefault();
                        }
                        
                        try {
                            isSaving = true;
                            
                            // 等待PDF完全加载
                            if (!pdfApp.pdfDocument || !pdfApp.pdfDocument.numPages) {
                                console.log('⏳ 等待PDF文档加载...');
                                await waitForPdfDocumentReady(pdfApp);
                            }
                            
                            // 调用主窗口（opener）的下载方法
                            if (window.opener && window.opener.app && typeof window.opener.app.downloadCurrentPdf === 'function') {
                                console.log('✅ 调用主窗口的downloadCurrentPdf方法');
                                await window.opener.app.downloadCurrentPdf();
                            } else {
                                console.warn('⚠️ 无法访问主窗口的保存方法，使用本地保存');
                                await downloadPdfWithAnnotations(pdfApp);
                            }
                        } catch (error) {
                            console.error('❌ 保存PDF失败:', error);
                            // 如果失败，回退到本地下载
                            try {
                                await downloadPdfWithAnnotations(pdfApp);
                            } catch (fallbackError) {
                                console.error('❌ 回退保存也失败:', fallbackError);
                            }
                        } finally {
                            // 释放保存锁
                            setTimeout(() => {
                                isSaving = false;
                            }, 1000);
                        }
                    });
                    
                    console.log('✅ 下载拦截器已设置');
                }, 100);
                
                // 10秒后清除定时器
                setTimeout(() => clearInterval(waitForPdfApp), 10000);
                
            } catch (error) {
                console.error('❌ 设置下载拦截器失败:', error);
            }
        }
        
        // 等待PDF文档完全加载
        function waitForPdfDocumentReady(pdfApp, maxWaitTime = 10000) {
            const startTime = Date.now();
            return new Promise((resolve, reject) => {
                const checkReady = () => {
                    if (Date.now() - startTime > maxWaitTime) {
                        reject(new Error('PDF加载超时'));
                        return;
                    }
                    
                    if (pdfApp.pdfDocument && pdfApp.pdfDocument.numPages && pdfApp.pdfViewer) {
                        console.log('✅ PDF文档已完全加载');
                        resolve();
                    } else {
                        setTimeout(checkReady, 100);
                    }
                };
                checkReady();
            });
        }
        
        // 下载包含标注的PDF（回退方案）
        async function downloadPdfWithAnnotations(pdfApp) {
            try {
                const pdfDocument = pdfApp.pdfDocument;
                if (!pdfDocument) {
                    console.warn('⚠️ PDF文档未加载');
                    performDefaultDownload(pdfApp);
                    return;
                }
                
                // 🔑 关键修复：确保所有标注已提交
                await ensureAnnotationsCommitted(pdfApp);
                
                // 尝试使用saveDocument方法（包含标注）- 带重试
                let pdfData = null;
                if (typeof pdfDocument.saveDocument === 'function') {
                    console.log('📝 使用saveDocument保存（包含标注）');
                    
                    // 添加重试机制
                    for (let attempt = 0; attempt < 3; attempt++) {
                        try {
                            if (attempt > 0) {
                                console.log(`🔄 重试保存 (${attempt + 1}/3)...`);
                                await ensureAnnotationsCommitted(pdfApp);
                                await new Promise(resolve => setTimeout(resolve, 300 * (attempt + 1)));
                            }
                            pdfData = await pdfDocument.saveDocument();
                            if (pdfData && pdfData.byteLength > 0) {
                                console.log(`✅ 保存成功 (${pdfData.byteLength} bytes)`);
                                break;
                            }
                        } catch (err) {
                            console.warn(`保存失败 (尝试 ${attempt + 1}/3):`, err);
                            if (attempt === 2) throw err;
                        }
                    }
                } else if (typeof pdfDocument.getData === 'function') {
                    console.log('📝 使用getData保存（可能不含标注）');
                    pdfData = await pdfDocument.getData();
                } else {
                    console.warn('⚠️ 无可用的保存方法');
                    performDefaultDownload(pdfApp);
                    return;
                }
                
                if (!pdfData) {
                    console.warn('⚠️ 未能获取PDF数据');
                    performDefaultDownload(pdfApp);
                    return;
                }
                
                // 创建Blob并触发下载
                const blob = new Blob([pdfData], { type: 'application/pdf' });
                
                // 获取文件名
                let filename = 'document.pdf';
                if (pdfApp.url) {
                    try {
                        const urlObj = new URL(pdfApp.url);
                        const pathParts = urlObj.pathname.split('/');
                        filename = pathParts[pathParts.length - 1] || 'document.pdf';
                    } catch (e) {
                        console.warn('解析文件名失败:', e);
                    }
                }
                
                // 触发下载到浏览器默认下载位置
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                console.log('✅ 带标注的PDF下载成功（浏览器默认位置）:', filename);
                
            } catch (error) {
                console.error('❌ 下载带标注的PDF失败:', error);
                throw error;
            }
        }
        
        // 🔑 确保所有标注已提交到annotationStorage
        async function ensureAnnotationsCommitted(pdfApp) {
            try {
                if (!pdfApp) return;
                
                console.log('🔄 检查并提交标注...');
                
                // 1. 等待所有页面渲染完成
                if (pdfApp.pdfViewer) {
                    const numPages = pdfApp.pdfDocument?.numPages || 0;
                    if (numPages > 0) {
                        const currentPage = pdfApp.pdfViewer.currentPageNumber || 1;
                        for (let i = Math.max(1, currentPage - 2); i <= Math.min(numPages, currentPage + 2); i++) {
                            try {
                                const pageView = pdfApp.pdfViewer.getPageView(i - 1);
                                if (pageView && !pageView.renderingState) {
                                    await pageView.draw();
                                }
                            } catch (e) {
                                // 忽略单个页面错误
                            }
                        }
                    }
                }
                
                // 2. 触发标注编辑器的保存
                if (pdfApp.pdfDocument?.annotationStorage) {
                    const storage = pdfApp.pdfDocument.annotationStorage;
                    if (storage.size > 0) {
                        console.log(`📝 发现 ${storage.size} 个标注`);
                    }
                    
                    // 触发编辑器提交
                    if (pdfApp.annotationEditorUIManager) {
                        if (typeof pdfApp.annotationEditorUIManager.unselectAll === 'function') {
                            pdfApp.annotationEditorUIManager.unselectAll();
                        }
                        if (typeof pdfApp.annotationEditorUIManager.commitAll === 'function') {
                            await pdfApp.annotationEditorUIManager.commitAll();
                        }
                    }
                }
                
                // 3. 等待提交完成
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // 4. 触发同步事件
                if (pdfApp.eventBus) {
                    pdfApp.eventBus.dispatch('annotationeditorstateschanged', {
                        source: this,
                        details: { hasChanged: true }
                    });
                }
                
                console.log('✅ 标注提交完成');
                
            } catch (error) {
                console.warn('⚠️ 标注提交过程出现警告:', error);
            }
        }
        
        // 执行默认下载（回退方案）
        function performDefaultDownload(pdfApp) {
            console.log('⚠️ 回退到默认下载方式');
            if (pdfApp && pdfApp.download) {
                pdfApp.download();
            }
        }
    </script>
</body>
</html>
