services:
  gewu:
    image: gewu:0.0.2
    ports:
      - "8000:8000"
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ALLOWED_ROOTS: /data,/home/node
    volumes:
      - ./projects:/data
      - ./home:/home/node
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:8000/',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
