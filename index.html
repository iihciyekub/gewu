<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reviewer - Overleaf Style</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="js/core/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="js/core/jquery.json-viewer.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script src="js/core/MathJax-3.2.2/es5/tex-mml-chtml.js" id="MathJax-script"></script>
</head>
<body>
    <!-- Project Header -->
    <div class="project-header">
        <div class="project-info">
            <i class="fas fa-folder-open"></i>
            <span id="currentProjectName">未加载项目</span>
            <span id="currentProjectPath" class="project-path"></span>
        </div>
        <div class="project-actions">
            <button class="btn btn-primary" id="switchProjectBtn" onclick="window.paperReviewerApp.showProjectSelector()">
                <i class="fas fa-exchange-alt"></i> 切换项目
            </button>
        </div>
    </div>

    <!-- Project Selector Modal -->
    <div class="modal" id="projectSelectorModal">
        <div class="modal-content project-selector-content">
            <div class="modal-header">
                <span>选择项目文件夹</span>
                <button class="close-btn" onclick="window.paperReviewerApp.closeProjectSelector()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="project-selector-info">
                    <i class="fas fa-info-circle"></i>
                    <p>请选择包含 <code>data/</code> 和 <code>papers/</code> 子文件夹的项目目录</p>
                </div>
                
                <div class="form-group">
                    <label for="projectPathInput">项目路径:</label>
                    <div class="path-input-group">
                        <input type="text" id="projectPathInput" placeholder="例如: /Users/username/my_project 或 user" readonly>
                        <button class="btn btn-browse" onclick="document.getElementById('projectFolderInput').click()">
                            <i class="fas fa-folder"></i> 浏览
                        </button>
                    </div>
                    <input type="file" id="projectFolderInput" webkitdirectory directory style="display: none;">
                </div>
                
                <div class="recent-projects" id="recentProjectsList">
                    <h4><i class="fas fa-history"></i> 最近的项目</h4>
                    <div class="recent-projects-list" id="recentProjectsContent">
                        <!-- 动态加载最近项目 -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="window.paperReviewerApp.closeProjectSelector()">取消</button>
                <button class="btn btn-primary" id="loadProjectBtn">加载项目</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Left Panel - File List -->
        <div class="left-panel">
            <div class="panel-header">
                <i class="fas fa-folder-open"></i> JSON Files
            </div>
            <div class="file-list" id="fileList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading files...
                </div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="leftResizer"></div>

        <!-- Middle Panel - JSON Editor -->
        <div class="middle-panel">
            <div class="middle-header">
                <div class="file-info">
                    <i class="fas fa-file-code"></i>
                    <span id="currentFileName">未选择文件</span>
                </div>
                <div class="header-actions">
                    <button id="addItemBtn" class="btn-add-item" style="display: none;" onclick="window.paperReviewerApp.openAddItemModal()">
                        <i class="fas fa-plus"></i> 添加条目
                    </button>
                    <button id="saveBtn" class="btn-save" style="display: none;" onclick="window.paperReviewerApp.saveToFile()">
                        <i class="fas fa-save"></i> 保存修改
                    </button>
                    <div class="view-tabs">
                        <button class="tab-btn active" data-view="structured">
                            <i class="fas fa-table"></i>
                        </button>
                        <button class="tab-btn" data-view="flat">
                            <i class="fas fa-code"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="editor-container">
                <div class="structured-view active" id="structuredView">
                    <div class="empty-state">
                        <i class="fas fa-file-alt"></i>
                        <h3>No File Selected</h3>
                        <p>Select a JSON file from the left panel to start editing</p>
                    </div>
                </div>
                <div class="flat-view" id="flatView">
                    <div class="empty-state">
                        <i class="fas fa-file-code"></i>
                        <h3>No File Selected</h3>
                        <p>Select a JSON file from the left panel to view JSON data</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="middleResizer"></div>

        <!-- Right Panel - PDF Viewer -->
        <div class="right-panel">
            <iframe id="pdfViewer" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Edit Value</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editTextarea">内容:</label>
                    <textarea id="editTextarea"></textarea>
                </div>
                
                <!-- 页码和引用编辑区 -->
                <div class="location-edit-section" id="locationEditSection" style="display: none;">
                    <div class="section-divider"></div>
                    <h4><i class="fa-solid fa-location-dot"></i> PDF 位置信息</h4>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editPageNumber">页码:</label>
                            <input type="number" id="editPageNumber" placeholder="PDF页码" min="1">
                        </div>
                        <div class="form-group">
                            <label for="editQuote">引用文本:</label>
                            <textarea id="editQuote" rows="3" placeholder="从PDF中复制的引用文本"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelEdit">取消</button>
                <button class="btn btn-primary" id="saveEdit">保存</button>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal" id="addItemModal">
        <div class="modal-content">
            <div class="modal-header">添加新条目</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="itemCategory">选择分类:</label>
                    <select id="itemCategory">
                        <option value="">-- 选择分类 --</option>
                        <option value="contributions">Contributions (贡献)</option>
                        <option value="limitations">Limitations (局限)</option>
                        <option value="methods">Methods (方法)</option>
                        <option value="findings">Findings (发现)</option>
                        <option value="future_work">Future Work (未来工作)</option>
                        <option value="notes">Notes (笔记)</option>
                        <option value="questions">Questions (问题)</option>
                        <option value="custom">Custom (自定义)</option>
                    </select>
                </div>
                
                <div class="form-group" id="customKeyGroup" style="display: none;">
                    <label for="customKey">自定义键名:</label>
                    <input type="text" id="customKey" placeholder="例如: related_work">
                </div>
                
                <div class="form-group">
                    <label for="itemContent">内容:</label>
                    <textarea id="itemContent" rows="4" placeholder="输入条目内容"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="itemPageNumber">页码 (可选):</label>
                    <input type="number" id="itemPageNumber" placeholder="PDF页码" min="1">
                </div>
                
                <div class="form-group">
                    <label for="itemQuote">引用文本 (可选):</label>
                    <textarea id="itemQuote" rows="2" placeholder="从PDF中复制的引用文本"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelAddItem">取消</button>
                <button class="btn btn-primary" id="saveAddItem">添加</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/core/jquery-3.7.0.js"></script>
    <script src="js/core/jquery.json-viewer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
