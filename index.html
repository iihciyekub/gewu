<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Reviewer - Overleaf Style</title>
    
    <!-- Favicon (Overleaf-style green) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%23138A07'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial,sans-serif'>R</text></svg>">
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="js/core/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="js/core/jquery.json-viewer.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script src="js/core/MathJax-3.2.2/es5/tex-mml-chtml.js" id="MathJax-script"></script>
    <script src="js/core/markdown-it.min.js"></script>
    <script src="js/core/markdown-it-footnote.min.js"></script>
    <script src="js/core/markdown-it-deflist.min.js"></script>
    <script src="js/core/markdown-it-sub.min.js"></script>
    <script src="js/core/markdown-it-sup.min.js"></script>
    <script src="js/core/markdown-it-container.min.js"></script>
    <script src="js/core/markdown-it-github-alerts.js"></script>
    <link rel="stylesheet" href="js/core/highlight/styles/github.min.css">
    <script src="js/core/highlight/highlight.min.js"></script>
</head>
<body>
    <!-- Project Selector Modal -->
    <div class="modal" id="projectSelectorModal">
        <div class="modal-content project-selector-content">
            <div class="modal-header">
                <span>选择项目文件夹</span>
                <button class="close-btn" onclick="window.paperReviewerApp.closeProjectSelector()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="project-selector-info">
                    <i class="fas fa-info-circle"></i>
                    <p>请选择包含 <code>data/</code> 和 <code>papers/</code> 子文件夹的项目目录</p>
                </div>
                
                <div class="form-group">
                    <label for="projectPathInput">项目路径:</label>
                    <div class="path-input-group">
                        <input type="text" id="projectPathInput" placeholder="例如: /Users/username/my_project 或 user" readonly>
                        <button class="btn btn-browse" onclick="document.getElementById('projectFolderInput').click()">
                            <i class="fas fa-folder"></i> 浏览
                        </button>
                    </div>
                    <input type="file" id="projectFolderInput" webkitdirectory directory style="display: none;">
                </div>
                
                <div class="recent-projects" id="recentProjectsList">
                    <h4><i class="fas fa-history"></i> 最近的项目</h4>
                    <div class="recent-projects-list" id="recentProjectsContent">
                        <!-- 动态加载最近项目 -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="window.paperReviewerApp.closeProjectSelector()">取消</button>
                <button class="btn btn-primary" id="loadProjectBtn">加载项目</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Left Panel - File List -->
        <div class="left-panel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <i class="fas fa-folder-open"></i>
                    <span id="currentProjectName">未加载项目</span>
                </div>
                <button class="btn-switch-project" onclick="window.paperReviewerApp.showProjectSelector()" title="切换项目">
                    <i class="fas fa-exchange-alt"></i>
                </button>
            </div>
            <div class="file-filter">
                <i class="fas fa-search"></i>
                <input type="text" id="fileFilterInput" placeholder="过滤文件..." autocomplete="off">
            </div>
            <div class="file-list" id="fileList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading files...
                </div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="leftResizer">
            <span class="resizer-toggle" title="点击隐藏/显示左侧面板"><i class="fas fa-angle-double-left"></i></span>
        </div>

        <!-- Middle Panel - JSON Editor -->
            <div class="middle-panel">
                <div class="middle-header">
                    <div class="file-meta">
                        <div class="file-sub">
                            <i class="fas fa-clock"></i>
                            <span id="lastUpdateDisplay">Last update: -</span>
                            <span class="markdown-status" id="markdownStatus"></span>
                        </div>
                    </div>
                    <div class="header-actions">
                        <div class="view-tabs">
                            <button class="tab-btn active" data-view="structured" title="JSON table view">
                                <i class="fas fa-table"></i>
                            </button>
                            <button class="tab-btn" data-view="flat" title="Raw JSON">
                                <i class="fas fa-code"></i>
                            </button>
                            <div class="header-divider"></div>
                            <button class="tab-btn" data-view="markdown" title="Markdown view">
                                <i class="fas fa-file-alt"></i>
                            </button>
                        </div>
                        <button id="saveBtn" class="btn-save" style="display: none;" onclick="window.paperReviewerApp.saveToFile()">
                            <i class="fas fa-save"></i> 保存修改
                        </button>
                        <button id="undoPasteBtn" class="btn-save" style="display: none;" title="撤销上次粘贴合并" onclick="window.paperReviewerApp.undoLastPaste()">
                            <i class="fas fa-undo"></i>
                        </button>
                        <button class="btn btn-primary" id="createMarkdownBtnHeader" style="display:none;" title="Create Markdown">
                            <i class="fas fa-file-medical"></i>
                        </button>
                        <button class="btn btn-success" id="editMarkdownBtnHeader" disabled title="Edit Markdown">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="btn btn-primary" id="saveMarkdownBtnHeader" disabled title="Save Markdown">
                            <i class="fas fa-save"></i>
                        </button>
                        <button class="btn btn-save" id="undoMarkdownPasteBtn" style="display: none;" title="撤销上次 QA 粘贴">
                            <i class="fas fa-undo"></i>
                        </button>
                        <div class="header-divider"></div>
                        <button id="copyWosAideBtn" class="btn btn-success" title="复制 wosAide.js 源码到剪贴板">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            <div class="editor-container">
                <div class="structured-view active" id="structuredView">
                    <div id="structuredContent">
                        <div class="empty-state">
                            <i class="fas fa-file-alt"></i>
                            <h3>No File Selected</h3>
                            <p>Select a JSON file from the left panel to start editing</p>
                        </div>
                    </div>
                    <div class="structured-footer">
                        <button id="addSectionBtn" class="btn-add-section" style="display: none;">
                            <i class="fas fa-plus"></i> 添加类字段
                        </button>
                    </div>
                </div>
                <div class="markdown-view" id="markdownView">
                    <div class="markdown-body" id="markdownRender">
                        <div class="empty-state">
                            <i class="fas fa-file-alt"></i>
                            <h3>No File Selected</h3>
                            <p>选择左侧 JSON 文件以查看对应的 Markdown 笔记</p>
                        </div>
                    </div>
                    <div class="markdown-editor" id="markdownEditor" style="display:none;">
                        <textarea id="markdownTextarea" spellcheck="false"></textarea>
                    </div>
                </div>
                <div class="flat-view" id="flatView">
                    <div class="empty-state">
                        <i class="fas fa-code"></i>
                        <h3>No File Selected</h3>
                        <p>选择左侧 JSON 查看原始 JSON</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="middleResizer">
            <span class="resizer-toggle" title="点击隐藏/显示右侧面板"><i class="fas fa-angle-double-right"></i></span>
        </div>

        <!-- Right Panel - PDF Viewer -->
        <div class="right-panel">
            <iframe id="pdfViewer" style="width: 100%; height: 100%; border: none;"></iframe>
            <!-- PDF.js 全屏快捷按钮 -->
            <button class="btn-pdfjs-fullscreen" id="btnPdfJsFullscreen" title="进入 PDF 全屏模式">
                <i class="fas fa-expand"></i>
            </button>
            <!-- PDF.js 保存快捷按钮 -->
            <button class="btn-pdfjs-download" id="btnPdfJsDownload" title="下载当前 PDF">
                <i class="fas fa-download"></i>
            </button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Edit Value</div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="editKeyInput">Field key:</label>
                        <input type="text" id="editKeyInput" placeholder="Edit field name">
                    </div>
                    <div class="form-group">
                        <label for="editTextarea">内容:</label>
                        <textarea id="editTextarea"></textarea>
                    </div>
                
                <!-- 页码和引用编辑区 -->
                <div class="location-edit-section" id="locationEditSection" style="display: none;">
                    <div class="section-divider"></div>
                    <h4><i class="fa-solid fa-location-dot"></i> PDF 位置信息</h4>
                    
                    <div class="form-group">
                        <label for="editPageNumber">页码:</label>
                        <input type="number" id="editPageNumber" placeholder="PDF页码" min="1">
                    </div>
                    
                    <div class="form-group">
                        <div class="quotes-header">
                            <label>引用文本:</label>
                            <div class="quote-actions">
                                <button type="button" class="btn-add-quote" id="btnAddQuote" title="添加引用">
                                    <i class="fas fa-plus"></i> 添加引用
                                </button>
                                <button type="button" class="btn-add-quote" id="btnFlattenQuote" title="整理粘贴文本为单行">
                                    <i class="fas fa-magic"></i> 一键整理
                                </button>
                                <button type="button" class="btn-add-quote" id="btnTestSearch" title="测试搜索并跳转PDF">
                                    <i class="fas fa-search-location"></i> 测试搜索
                                </button>
                            </div>
                        </div>
                        
                        <!-- 标签页头部 -->
                        <div class="quote-tabs" id="quoteTabs"></div>
                        
                        <!-- 标签页内容 -->
                        <div class="quote-panels" id="quotePanels"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="deleteEdit">删除字段</button>
                <button class="btn btn-cancel" id="cancelEdit">取消</button>
                <button class="btn btn-primary" id="saveEdit">保存</button>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal" id="addItemModal">
        <div class="modal-content">
            <div class="modal-header">添加新条目</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="itemCategory">选择分类:</label>
                    <select id="itemCategory">
                        <option value="">-- 选择分类 --</option>
                        <option value="contributions">Contributions (贡献)</option>
                        <option value="limitations">Limitations (局限)</option>
                        <option value="methods">Methods (方法)</option>
                        <option value="findings">Findings (发现)</option>
                        <option value="future_work">Future Work (未来工作)</option>
                        <option value="notes">Notes (笔记)</option>
                        <option value="questions">Questions (问题)</option>
                        <option value="custom">Custom (自定义)</option>
                    </select>
                </div>
                
                <div class="form-group" id="customKeyGroup" style="display: none;">
                    <label for="customKey">自定义键名:</label>
                    <input type="text" id="customKey" placeholder="例如: related_work">
                </div>
                
                <div class="form-group">
                    <label for="itemContent">内容:</label>
                    <textarea id="itemContent" rows="4" placeholder="输入条目内容"></textarea>
                </div>
                
                <!-- PDF 位置信息 -->
                <div class="location-edit-section">
                    <div class="section-divider"></div>
                    <h4><i class="fa-solid fa-location-dot"></i> PDF 位置信息 (可选)</h4>
                    
                    <div class="form-group">
                        <label for="itemPageNumber">页码:</label>
                        <input type="number" id="itemPageNumber" placeholder="PDF页码" min="1">
                    </div>
                    
                    <div class="form-group">
                        <div class="quotes-header">
                            <label>引用文本:</label>
                            <button type="button" class="btn-add-quote" id="btnAddQuoteItem" title="添加引用">
                                <i class="fas fa-plus"></i> 添加引用
                            </button>
                        </div>
                        
                        <!-- 标签页头部 -->
                        <div class="quote-tabs" id="quoteTabsItem"></div>
                        
                        <!-- 标签页内容 -->
                        <div class="quote-panels" id="quotePanelsItem"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelAddItem">取消</button>
                <button class="btn btn-primary" id="saveAddItem">添加</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/core/jquery-3.7.0.js"></script>
    <script src="js/core/jquery.json-viewer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
